<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — Amaanat</title>
    <meta name="description" content="Shop Amaanat everyday gold-tone jewellery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="shop">
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header" id="header"></header>
    <main id="main">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span>Shop</nav>
      <header class="page-header">
        <h1 id="shop-title">The collection</h1>
        <p id="shop-sub">Everyday gold-tone pieces, made to be worn.</p>
      </header>
      <form class="shop-controls" id="shop-controls" role="search">
        <div class="filter-tabs" id="filter-tabs" aria-label="Collections"></div>
        <div class="shop-tools">
          <label class="visually-hidden" for="q">Search</label>
          <input class="search-input" id="q" name="q" type="search" placeholder="Search pieces" maxlength="80" />
          <label class="check"><input type="checkbox" id="inStock" name="inStock" /> In stock</label>
          <label class="visually-hidden" for="sort">Sort</label>
          <select class="sort-select" id="sort" name="sort">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="name">Name</option>
          </select>
        </div>
      </form>
      <p class="results-count" id="results-count" aria-live="polite"></p>
      <div class="product-grid" id="product-grid"></div>
    </main>
    <footer class="site-footer"></footer>
    <script src="/app.js"></script>
    <script src="/js/shop.js"></script>
  </body>
</html>
