<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track your order — Amaanat</title>
    <meta name="description" content="Track an Amaanat order." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="track">
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header" id="header"></header>
    <main id="main">
      <section class="tracking-container">
        <h1>Track your order</h1>
        <p>Enter the order reference from your confirmation and the email used at checkout.</p>
        <form class="tracking-form" id="track-form" novalidate>
          <div class="form-group"><label for="ref">Order reference</label><input id="ref" name="ref" placeholder="AM-1A2B3C4D" required maxlength="11" autocapitalize="characters" /></div>
          <div class="form-group"><label for="t-email">Email</label><input id="t-email" name="email" type="email" required maxlength="254" autocomplete="email" /></div>
          <button class="btn btn-gold" type="submit">Find order</button>
        </form>
        <div id="track-result" aria-live="polite"></div>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <script src="/app.js"></script>
    <script src="/js/track.js"></script>
  </body>
</html>
